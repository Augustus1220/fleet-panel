# Hysteria2 residential instance: all traffic exits via the residential
# HTTP proxy (TCP only - the proxy cannot carry UDP; see docs/channels.md).
listen: 0.0.0.0:2054

tls:
  cert: /opt/fleet-hy2/public-tls.crt
  key: /opt/fleet-hy2/public-tls.key

auth:
  type: userpass
  userpass:
    alice_mac: "PASSWORD_ALICE_MAC"
    alice_desktop: "PASSWORD_ALICE_DESKTOP"
    alice_iphone: "PASSWORD_ALICE_IPHONE"
    bob: "PASSWORD_BOB"

outbounds:
  - name: webshare
    type: http
    http:
      url: http://RESIDENTIAL_PROXY_USER:RESIDENTIAL_PROXY_PASS@203.0.113.10:8080
  - name: direct
    type: direct

acl:
  inline:
    - reject(0.0.0.0/8)
    - reject(10.0.0.0/8)
    - reject(100.64.0.0/10)
    - reject(127.0.0.0/8)
    - reject(169.254.0.0/16)
    - reject(172.16.0.0/12)
    - reject(192.168.0.0/16)
    - reject(::1/128)
    - reject(fc00::/7)
    - reject(fe80::/10)
    - webshare(all)

masquerade:
  type: proxy
  proxy:
    url: https://www.microsoft.com
    rewriteHost: true

trafficStats:
  listen: 127.0.0.1:29004
  secret: TRAFFIC_STATS_SECRET  # keep it unquoted, or the panel collector must strip the quotes
