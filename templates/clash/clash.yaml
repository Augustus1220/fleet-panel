# Per-account Clash (mihomo) subscription skeleton.
# One file like this is generated per account; only the credentials and
# the node credentials change between accounts. Node naming convention:
# <Region>-<Account>-<Channel>, residential channels keep a "Residential"
# prefix so users can tell the exit identity at a glance.
mixed-port: 7890
mode: rule
log-level: info
ipv6: false
find-process-mode: always # required, otherwise PROCESS-NAME rules never match

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query

proxies:
  - name: "US-Alice-HY2"
    type: hysteria2
    server: node.example.com
    port: 443
    ports: "20000-30000" # port hopping; remove if your client lacks support
    hop-interval: 30
    password: "alice_mac:PASSWORD_ALICE_MAC" # HY2 userpass is "user:password"
    sni: node.example.com
    skip-cert-verify: false
  - name: "US-Alice-ResidentialHY2"
    type: hysteria2
    server: node.example.com
    port: 2054
    password: "alice_mac:PASSWORD_ALICE_MAC"
    sni: node.example.com
  - name: "US-Alice-VLESS"
    type: vless
    server: node.example.com
    port: 2053
    uuid: UUID_ALICE_MAC
    network: tcp
    tls: true
    servername: node.example.com
    flow: xtls-rprx-vision
    client-fingerprint: chrome
  - name: "US-Alice-ResidentialVLESS"
    type: vless
    server: node.example.com
    port: 2054
    uuid: UUID_ALICE_MAC
    network: tcp
    tls: true
    servername: node.example.com
    flow: xtls-rprx-vision
    client-fingerprint: chrome
  - name: "US-Alice-Reality"
    type: vless
    server: node.example.com
    port: 443
    uuid: UUID_ALICE_MAC
    network: tcp
    tls: true
    servername: www.microsoft.com
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    reality-opts:
      public-key: REALITY_PUBLIC_KEY
      short-id: SHORT_ID_HEX
      support-x25519mlkem768: true # required for mihomo + ML-KEM Reality keys
  - name: "US-Alice-ResidentialReality"
    type: vless
    server: node.example.com
    port: 443
    uuid: UUID_ALICE_MAC_WS # the account's second UUID; its server-side email is "mac-ws" (see docs/channels.md)
    network: tcp
    tls: true
    servername: www.microsoft.com
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    reality-opts:
      public-key: REALITY_PUBLIC_KEY
      short-id: SHORT_ID_HEX
      support-x25519mlkem768: true

proxy-groups:
  - name: "US"
    type: select
    proxies:
      - "US-Alice-Reality"
      - "US-Alice-HY2"
      - "US-Alice-ResidentialReality"
      - "US-Alice-ResidentialHY2"
      - "US-Alice-VLESS"
      - "US-Alice-ResidentialVLESS"

# Plug your own rule providers / rule sets here. Keep the skeleton order:
# private + domestic direct first, everything else to the proxy group.
rules:
  - DOMAIN-SUFFIX,example-direct.com,DIRECT # your own always-direct entries
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,US
